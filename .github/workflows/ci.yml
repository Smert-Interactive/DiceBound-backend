name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dicebound_test
          POSTGRES_PASSWORD: dicebound_test
          POSTGRES_DB: dicebound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dicebound_test -d dicebound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dicebound_test:dicebound_test@127.0.0.1:5432/dicebound_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Node.js project
        id: project
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ ! -f package.json && ! -f package-lock.json ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend is not scaffolded yet; Node.js checks were skipped."
          else
            echo "::error::Commit package.json and package-lock.json together."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.project.outputs.ready == 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.project.outputs.ready == 'true'
        run: npm run db:generate

      - name: Validate Prisma schema
        if: steps.project.outputs.ready == 'true'
        run: npm run db:validate

      - name: Validate built-in seed contract
        if: steps.project.outputs.ready == 'true'
        run: npm run test:seed

      - name: Lint
        if: steps.project.outputs.ready == 'true'
        run: npm run lint

      - name: Test
        if: steps.project.outputs.ready == 'true'
        run: npm test

      - name: Test e2e
        if: steps.project.outputs.ready == 'true'
        run: npm run test:e2e

      - name: Build
        if: steps.project.outputs.ready == 'true'
        run: npm run build

      - name: Test PostgreSQL migrations and storage
        if: steps.project.outputs.ready == 'true'
        run: npm run test:db

      - name: Test authentication with PostgreSQL
        if: steps.project.outputs.ready == 'true'
        run: npm run test:auth:db

      - name: Test game systems with PostgreSQL
        if: steps.project.outputs.ready == 'true'
        run: npm run test:systems:db

      - name: Test characters with PostgreSQL
        if: steps.project.outputs.ready == 'true'
        run: npm run test:characters:db

      - name: Test character history with PostgreSQL
        if: steps.project.outputs.ready == 'true'
        run: npm run test:history:db

  publish:
    name: publish-backend-image
    needs: quality

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/smert-interactive/dicebound-backend:sha-${{ github.sha }}
